name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: swift --version

      - name: Test
        run: swift test --parallel

      - name: Build app bundle
        run: VERSION="${GITHUB_REF_NAME#v}" ./Scripts/package_app.sh
        env:
          CONFIG: release
          BUILD_NUMBER: ${{ github.run_number }}
          SPROCKET_SIGNING: adhoc

      - name: Archive app
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          artifact="Sprocket-${version}-macos.zip"
          ditto -c -k --keepParent build/Sprocket.app "build/${artifact}"
          shasum -a 256 "build/${artifact}" | tee "build/${artifact}.sha256"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          artifact="Sprocket-${version}-macos.zip"
          gh release create "$GITHUB_REF_NAME" \
            "build/${artifact}" \
            "build/${artifact}.sha256" \
            --title "Sprocket ${version}" \
            --generate-notes

      - name: Update Homebrew cask
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          artifact="$(pwd)/build/Sprocket-${version}-macos.zip"
          git fetch origin main
          git switch -C main origin/main
          ./Scripts/update_cask.sh "$version" "$artifact"
          if git diff --quiet -- Casks/sprocket.rb; then
            echo "Cask already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/sprocket.rb
          git commit -m "Update Homebrew cask to ${version}"
          git push origin main

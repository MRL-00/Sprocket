name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: [self-hosted, macOS, ARM64, mac-mini]
    env:
      # Xcode 27's build system collides the "Sprocket" and "sprocket" products on
      # case-insensitive APFS, so build with Xcode 26 like the macos-26 image did.
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: swift --version

      - name: Build
        run: swift build -c debug

      - name: Test
        run: swift test --parallel

      - name: Package app bundle
        run: ./Scripts/package_app.sh
        env:
          CONFIG: release
